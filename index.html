<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Log</title>
<meta name="theme-color" content="#070b0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app. Sticky title bar with four tabs (Today / Runs / History / Account), set rows like a lifting logbook, simple SVG charts. */
:root{
  --bg:#070b0f; --surface:rgba(255,255,255,.05); --ink:#f1f5f7; --muted:#8e9ba6; --line:rgba(255,255,255,.1);
  --accent:#b6f43a; --accent-ink:#0a1006; --done:#b6f43a; --done-bg:rgba(182,244,58,.12); --danger:#ff7a66; --target:#b6f43a;
  --glow:0 0 18px rgba(182,244,58,.45);
  --ambient:radial-gradient(60% 40% at 85% 0%,rgba(24,120,140,.35),transparent 70%),radial-gradient(70% 45% at 10% 100%,rgba(20,150,110,.30),transparent 70%),radial-gradient(50% 30% at 100% 60%,rgba(40,90,180,.18),transparent 70%),#070b0f;
  --display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.02em;text-transform:uppercase;margin:0}
.sub{color:var(--muted);font-size:14px;margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.tab{min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);border-radius:8px;letter-spacing:.04em;text-transform:uppercase;padding:0 4px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:12px;padding-top:14px}
label.l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
input,textarea,select{font:500 17px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;min-width:0;width:100%}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.datebar input{width:auto}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:var(--done);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;margin:0;letter-spacing:.02em;text-transform:uppercase}
.card h3{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-left{display:flex;gap:12px;align-items:flex-start;min-width:0}
.target{font:600 13px var(--body);letter-spacing:.06em;color:var(--accent);white-space:nowrap;border:1px solid var(--accent);border-radius:6px;padding:3px 7px;font-variant-numeric:tabular-nums}
.last{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb{flex:none;width:64px;height:64px;border-radius:8px;border:1px dashed var(--line);background:var(--bg);color:var(--muted);font:600 11px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center}
.setrow .n{font:700 20px var(--display);color:var(--muted);text-align:center}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chk{min-height:48px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--muted);font:700 20px var(--body)}
.setrow.done .chk,.warm.done .chk{background:var(--done);border-color:var(--done);color:var(--bg)}
.setrow.done input{background:var(--done-bg);border-color:var(--done)}
.ghost{min-height:44px;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;font:600 14px var(--body)}
.btn{min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:600 15px var(--body);padding:0 14px}
.primary{min-height:52px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;font:700 22px var(--display);letter-spacing:.06em;text-transform:uppercase}
.primary:disabled{opacity:.4}
.warm{flex-direction:row;align-items:center;gap:12px}
.warm .chk{width:52px;flex:none}
textarea{resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:92vw;text-align:center}
.toast[hidden]{display:none}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
th{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:4px 6px 6px}
td{padding:9px 6px;border-top:1px solid var(--line)}
td.num,th.num{text-align:right}
.scroll{overflow-x:auto}
.sess-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sess-head b{font:700 20px var(--display);letter-spacing:.03em;text-transform:uppercase}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:15px;font-variant-numeric:tabular-nums}
.list li{display:flex;justify-content:space-between;gap:10px}
.list li span:last-child{text-align:right;color:var(--muted)}
.note{font-size:14px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.del{align-self:flex-start;border:0;background:transparent;color:var(--danger);font:600 14px var(--body);min-height:44px;padding:0 4px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pacebox{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.pacebox b{font:700 28px var(--display);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px var(--body)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.feel .chip{padding:0;border-radius:8px;font:700 18px var(--display)}
.feelcap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.runitem{display:flex;flex-direction:column;gap:6px}
.runhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.runhead b{font:700 20px var(--display);letter-spacing:.03em;text-transform:uppercase}
.runmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;font-variant-numeric:tabular-nums}
.tag{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--muted);font:10px var(--body);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.cur{fill:var(--done)}
.chart .val{fill:var(--ink);font:600 10px var(--body)}
.chart .pt.tm{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.chart .tg{stroke:var(--target);stroke-width:1.5;stroke-dasharray:4 3}
.chart .tgl{fill:var(--target);font:600 10px var(--body)}
.sync{display:flex;align-items:center;gap:8px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--done)}.dot.err{background:var(--danger)}
.help{font-size:14px;color:var(--muted)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.lb{position:fixed;inset:0;z-index:30;background:rgba(10,14,18,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:70%;border-radius:10px;object-fit:contain}
.lb .cap{color:#fff;font:700 22px var(--display);letter-spacing:.04em;text-transform:uppercase}
.lb .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lb button{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid #fff;background:transparent;color:#fff;font:600 15px var(--body)}
.lb button.rm{border-color:#ff8a75;color:#ff8a75}
#gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
#gate[hidden]{display:none}
.gatecard{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.gatecard h1{font-size:44px}
.locked .wrap{display:none}
.where{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.scanline{font-size:14px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg .chip{border-radius:8px;font:700 20px var(--display);letter-spacing:.06em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.progress>i{transition:none}}

/* ---- Glow theme: glass cards, lime accent, floating nav ---- */
html{background:#070b0f}
body{background:transparent;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--ambient);pointer-events:none}
header{position:static;background:transparent;border-bottom:0;padding:calc(18px + env(safe-area-inset-top,0px)) 0 4px}
h1{font-weight:700;font-size:32px;letter-spacing:-.02em;text-transform:none}
.sub{font-weight:500}
.tabs{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;z-index:15;
  height:66px;padding:7px;gap:4px;border-radius:33px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),rgba(10,15,20,.88);border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.tab{border:0;background:transparent;color:var(--muted);border-radius:26px;text-transform:none;letter-spacing:0;font:600 14px var(--body);min-height:0}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{gap:14px}
input,textarea,select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;color:var(--ink);font-weight:600}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--glow)}
input::placeholder,textarea::placeholder{color:#5f6c77;font-weight:500}
.card,.stat{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.1);border-radius:22px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.card{padding:16px;gap:12px}
.card h2{font-weight:700;font-size:19px;letter-spacing:-.01em;text-transform:none}
.card h3{letter-spacing:.06em}
.stat{padding:14px 12px}
.stat b{font:700 28px/1 var(--display);letter-spacing:-.02em}
.stat span{text-transform:none;letter-spacing:0;font-size:12px;font-weight:500}
.target{color:var(--accent);border:0;background:rgba(182,244,58,.12);border-radius:12px;padding:5px 10px}
.thumb{border-radius:16px;border:1px dashed rgba(255,255,255,.22);background:rgba(255,255,255,.05)}
.setrow{grid-template-columns:24px 1fr 1fr 48px}
.setrow .n{font:600 14px var(--body)}
.chk{width:48px;min-height:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:transparent;justify-self:center;font:700 20px var(--body)}
.setrow.done .chk,.warm.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}
.setrow.done input{background:rgba(182,244,58,.12);border-color:rgba(182,244,58,.5);color:var(--accent)}
.warm .chk{width:48px}
.ghost{border:1px dashed rgba(255,255,255,.22);border-radius:14px;color:var(--muted)}
.btn{background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.25);border-radius:16px;color:var(--accent);min-height:48px}
.primary{min-height:54px;border-radius:27px;background:var(--accent);color:var(--accent-ink);font:700 16px var(--body);letter-spacing:.02em;text-transform:none;box-shadow:var(--glow)}
.primary:disabled{opacity:.35;box-shadow:none}
.chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:22px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--glow);font-weight:700}
.seg{grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:26px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.seg .chip{border:0;background:transparent;border-radius:22px;font:600 14px var(--body);letter-spacing:0;text-transform:none;padding:0;color:var(--muted)}
.seg .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow);font-weight:700}
.feel .chip{border-radius:14px;font:700 16px var(--body)}
.pacebox b{font:700 26px var(--display);letter-spacing:-.02em}
.runhead b,.sess-head b{font:700 17px var(--display);letter-spacing:-.01em;text-transform:none}
.tag{border:0;background:rgba(255,255,255,.08);border-radius:8px;padding:3px 8px;text-transform:none;letter-spacing:0;font-size:12px}
.progress{height:8px;background:rgba(255,255,255,.1);border-radius:4px}
.progress>i{background:var(--accent);box-shadow:var(--glow)}
.chart .bar{fill:rgba(182,244,58,.4)}
.chart .bar.cur{fill:var(--accent);filter:drop-shadow(0 0 6px rgba(182,244,58,.6))}
.chart .ln{stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 0 5px rgba(182,244,58,.55))}
.chart .pt{fill:#fff;stroke:none}
.chart .pt.tm{fill:#070b0f;stroke:#fff;stroke-width:2}
.chart .tg{stroke-opacity:.7}
.toast{background:rgba(20,28,34,.92);color:var(--ink);border:1px solid rgba(182,244,58,.5);border-radius:16px;box-shadow:var(--glow);bottom:calc(98px + env(safe-area-inset-bottom,0px));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.lb button{border-radius:22px}
#gate{background:var(--ambient)}
.gatecard h1{font-size:40px}
.del{color:var(--danger)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gym Log</h1>
    <div class="sub"><span>Workout A &amp; cardio</span><span aria-hidden="true">·</span><span class="sync"><i class="dot" id="dot"></i><span id="status">Saved on this phone</span></span></div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="today" aria-selected="true">Today</button>
      <button class="tab" role="tab" data-tab="runs" aria-selected="false">Cardio</button>
      <button class="tab" role="tab" data-tab="hist" aria-selected="false">History</button>
      <button class="tab" role="tab" data-tab="acct" aria-selected="false">Account</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<div id="gate" hidden>
  <form id="gateform" class="gatecard" autocomplete="on">
    <h1>Gym Log</h1>
    <p class="help">Sign in to open your log.</p>
    <label class="field"><span>Email</span><input type="email" id="gem" name="email" autocomplete="username" inputmode="email" autocapitalize="off" required></label>
    <label class="field"><span>Password</span><input type="password" id="gpw" name="password" autocomplete="current-password" required></label>
    <button class="primary" id="gbtn" type="submit">Sign in</button>
    <div class="help" id="gerr" role="alert"></div>
  </form>
</div>
<input type="file" id="pick" accept="image/*" hidden>
<input type="file" id="scanfile" accept="image/*" hidden>
<input type="file" id="importfile" accept="application/json,.json" hidden>
<div class="toast" id="toast" hidden></div>

<script src="firebase-config.js"></script>
<script>
(function(){
  "use strict";
  var EX=[
    {id:"leg-press",name:"Leg press",sets:3,range:"10–12",rest:"Rest about 2 min"},
    {id:"chest-press",name:"Chest press machine",sets:3,range:"10–12"},
    {id:"lat-pulldown",name:"Lat pulldown",sets:3,range:"10–12"},
    {id:"leg-curl",name:"Seated leg curl",sets:3,range:"12"},
    {id:"shoulder-press",name:"Shoulder press machine",sets:2,range:"10–12"},
    {id:"core",name:"Cable crunch / plank",sets:3,range:"12",unit:"reps or sec"}
  ];
  var TARGET_SECS_PER_KM=8100/21.0975; // sub 2:15 half marathon
  var K={data:"gl-data-v2",photos:"gl-photos-v2",draft:"gl-draft-v2",runDraft:"gl-rundraft-v2",auth:"gl-auth-v1"};
  var state={sessions:[],runs:[]}, photos={}, draft=null, runDraft=null, tab="today";
  var confirmDel=null, pickFor=null, importText="";
  var cloud={ready:false,uid:null,email:null,db:null,unsubs:[],err:null,configured:false,loading:false};
  var $=function(s){return document.querySelector(s)};
  var main=$("#main");

  /* ---------- helpers ---------- */
  function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function num(v){var n=parseFloat(v);return isFinite(n)?n:null}
  function pad(n){return String(n).padStart(2,"0")}
  function todayISO(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function parseISO(iso){var p=iso.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
  function toISO(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function fmtDate(iso){return parseISO(iso).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
  var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function fmtShort(iso){var d=parseISO(iso);return d.getDate()+" "+MON[d.getMonth()]}

  function shrink(file,maxSide,quality){

        c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);

        URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",quality||0.72));

  function weeklyTotals(n,act){

  function weeklyChart(act){

    data.forEach(function(d,i){

  function paceChart(act){

  /* ---------- photo scan (Firebase AI Logic, Gemini) ---------- */
  var AI_BASE="https://www.gstatic.com/firebasejs/13.0.0/";
  var AI_MODEL="gemini-3.5-flash";
  var aiModel=null, scanning=false;
  async function getAiModel(){
    if(aiModel)return aiModel;
    var cfg=window.FIREBASE_CONFIG;
    var appMod=await import(AI_BASE+"firebase-app.js");
    var existing=appMod.getApps().filter(function(a){return a.name==="gl-ai"})[0];
    var app=existing||appMod.initializeApp(cfg,"gl-ai");
    var key=window.FIREBASE_APPCHECK_SITE_KEY;
    if(key&&!existing){
      var ac=await import(AI_BASE+"firebase-app-check.js");
      var Provider=window.FIREBASE_APPCHECK_PROVIDER==="enterprise"?ac.ReCaptchaEnterpriseProvider:ac.ReCaptchaV3Provider;
      ac.initializeAppCheck(app,{provider:new Provider(key),isTokenAutoRefreshEnabled:true});
    }
    var aiMod=await import(AI_BASE+"firebase-ai.js");
    var ai=aiMod.getAI(app,{backend:new aiMod.GoogleAIBackend()});
    aiModel=aiMod.getGenerativeModel(ai,{model:AI_MODEL,generationConfig:{responseMimeType:"application/json"}});
    return aiModel;
  }
  function parseClock(v){
    if(v==null)return null;
    if(typeof v==="number")return v>0?v:null;
    var parts=String(v).trim().split(":"),t=0;
    if(!parts.length||parts.length>3)return null;
    for(var i=0;i<parts.length;i++){var n=parseFloat(parts[i]);if(!isFinite(n)||n<0)return null;t=t*60+n}
    return t>0?t:null;
  }
  function scanPrompt(act){
    return "This is a photo of the display on a gym "+(act==="Row"?"rowing machine (for example a Concept2 PM5 monitor)":act==="Cycle"?"exercise bike":act==="Stairs"?"stair climber (for example a StairMaster)":"treadmill")+". "+
      "Read the workout totals shown on the screen. Return only a JSON object with these keys, using null for anything that is not clearly visible. Never guess or calculate values. "+
      '{"distance": number (for a stair climber this is the number of floors, never steps), "distance_unit": "m" | "km" | "mi", "time": "total elapsed time as shown, like 8:20.4 or 31:12 or 1:02:03", '+
      '"avg_split_per_500m": "string or null", "stroke_rate_spm": number or null, "avg_watts": number or null, "calories": number or null, "avg_heart_rate": number or null, '+
      '"level": number or null, "avg_speed": number or null, "speed_unit": "kmh" | "mph" | null, "incline_percent": number or null}';
  }
  function interpretScan(raw,act){
    var o=raw;
    if(typeof o==="string"){
      var t=o.replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
      try{o=JSON.parse(t)}catch(e){return null}
    }
    if(!o||typeof o!=="object")return null;
    var dist=num(o.distance),secs=parseClock(o.time);
    if(!(dist>0)||!(secs>0))return null;
    var unit=String(o.distance_unit||"").toLowerCase(),km;
    if(act==="Stairs"&&(unit==="steps"||unit==="step"))return null;
    if(unit==="mi"||unit==="miles")km=dist*1.609344;
    else if(unit==="m"||unit==="meters"||unit==="metres")km=dist/1000;
    else if(unit==="km")km=dist;
    else km=act==="Row"?dist/1000:dist;
    if(act==="Stairs")km=dist;
    if(act==="Row"&&km<0.1)return null;
    var extra=[];
    if(num(o.stroke_rate_spm)>0)extra.push("Rate "+Math.round(num(o.stroke_rate_spm))+" spm");
    if(num(o.avg_watts)>0)extra.push(Math.round(num(o.avg_watts))+" W");
    if(num(o.calories)>0)extra.push(Math.round(num(o.calories))+" cal");
    if(num(o.avg_heart_rate)>0)extra.push("HR "+Math.round(num(o.avg_heart_rate)));
    if(act==="Stairs"&&num(o.level)>0)extra.push("Level "+Math.round(num(o.level)));
    if(act==="Run"&&num(o.incline_percent)>0)extra.push("Incline "+num(o.incline_percent)+"%");
    return {km:km,secs:secs,extra:extra.join(" · ")};
  }
  async function doScan(file){
    if(scanning)return;
    if(!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey)){toast("Photo scan needs the Firebase setup. See the README.");return}
    if(!navigator.onLine){toast("Photo scan needs an internet connection.");return}
    var act=runDraft.act;
    scanning=true;render();
    try{
      var dataUrl=await shrink(file,1280,0.85);
      var model=await getAiModel();
      var result=await model.generateContent([scanPrompt(act),{inlineData:{data:dataUrl.split(",")[1],mimeType:"image/jpeg"}}]);
      var text=result.response.text();
      var r=interpretScan(text,act);
      if(!r){toast("Couldn't read the numbers. Try again closer, or type them in.");return}
      var secs=Math.round(r.secs),h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60),sec=secs%60;
      runDraft.km=String(act==="Row"?Math.round(r.km*1000):Math.round(r.km*100)/100);
      runDraft.h=h?String(h):"";runDraft.m=String(m);runDraft.s=String(sec);
      if(act==="Run")runDraft.where="Treadmill";else if(act==="Cycle")runDraft.where="Indoor";
      if(r.extra)runDraft.note=runDraft.note?runDraft.note+"\n"+r.extra:r.extra;
      saveRunDraft();
      toast("Filled in from the photo. Check the numbers, then save.");
    }catch(e){
      var msg=String(e&&e.message||e);
      if(/app.?check/i.test(msg))toast("Photo scan isn't switched on yet (App Check). See the README.");
      else if(/403|permission|not been used|disabled|API key/i.test(msg))toast("Photo scan isn't switched on yet (Firebase AI Logic). See the README.");
      else if(/429|quota|rate/i.test(msg))toast("Photo scan limit reached. Try again in a minute.");
      else toast("Photo scan failed. Check your connection and try again.");
    }finally{
      scanning=false;render();
    }
  }
  $("#scanfile").addEventListener("change",function(ev){
    var f=ev.target.files&&ev.target.files[0];ev.target.value="";
    if(f)doScan(f);
  });

  /* ---------- import / export ---------- */
  function backupJSON(){return JSON.stringify({app:"gym-log",v:2,sessions:state.sessions,runs:state.runs,photos:photos})}
  function importData(text){
    var o;
    try{o=JSON.parse(text)}catch(e){toast("That doesn't look like a backup");return}
    if(!o||typeof o!=="object"||(!Array.isArray(o.sessions)&&!Array.isArray(o.runs)&&!o.photos)){toast("That doesn't look like a backup");return}
    var addS=0,addR=0,addP=0;
    var haveS={},haveR={};
    state.sessions.forEach(function(x){haveS[x.id]=1});state.runs.forEach(function(x){haveR[x.id]=1});
    (o.sessions||[]).forEach(function(x){if(x&&x.id&&x.date&&x.sets&&!haveS[x.id]){state.sessions.push(x);haveS[x.id]=1;addS++;cw("sessions",x.id,x)}});
    (o.runs||[]).forEach(function(x){if(x&&x.id&&x.date&&x.km>0&&!haveR[x.id]){state.runs.push(x);haveR[x.id]=1;addR++;cw("runs",x.id,x)}});
    var ph=o.photos&&typeof o.photos==="object"?o.photos:{};
    Object.keys(ph).forEach(function(k){if(typeof ph[k]==="string"&&ph[k].indexOf("data:image/")===0&&!photos[k]){photos[k]=ph[k];addP++;cw("photos",k,{data:ph[k]})}});
    saveLocal();importText="";render();
    toast("Imported "+addS+" workout"+(addS===1?"":"s")+", "+addR+" run"+(addR===1?"":"s")+", "+addP+" photo"+(addP===1?"":"s"));
  }
  $("#importfile").addEventListener("change",function(ev){
    var f=ev.target.files&&ev.target.files[0];ev.target.value="";if(!f)return;
    var r=new FileReader();r.onload=function(){importData(String(r.result))};r.onerror=function(){toast("Couldn't read that file")};r.readAsText(f);
  });

  /* ---------- rendering ---------- */
  function renderToday(){
    var h='<div class="datebar"><label class="l" for="date">Session date</label><input type="date" id="date" value="'+esc(draft.date)+'"></div>';
    h+='<div><div class="progress"><i id="prog"></i></div><div class="last" id="proglabel" style="margin-top:6px"></div></div>';
    h+='<div class="card warm'+(draft.warm?' done':'')+'" id="warmcard"><button class="chk" id="warm" aria-label="Warm-up done" style="width:52px">'+(draft.warm?'✓':'')+'</button><div><h2>Warm-up</h2><div class="last">5 min treadmill or bike, easy</div></div></div>';
    EX.forEach(function(e){
      var last=lastFor(e.id),ph=photos[e.id];
      h+='<section class="card" data-ex="'+e.id+'"><div class="card-top"><div class="card-left"><button class="thumb" data-act="photo" aria-label="'+(ph?'View photo of ':'Add a photo of ')+esc(e.name)+'">'+(ph?'<img alt="'+esc(e.name)+'" src="'+ph+'">':'+ Photo')+'</button><h2>'+esc(e.name)+'</h2></div><span class="target">'+e.sets+' × '+e.range+'</span></div>';
      h+='<div class="last">'+(last?'Last time: '+esc(fmtSets(last)):'First time. Start light, leave 2 reps in the tank.')+(e.rest?' · '+e.rest:'')+'</div>';
      draft.sets[e.id].forEach(function(s,i){
        h+='<div class="setrow'+(s.done?' done':'')+'" data-i="'+i+'"><span class="n">'+(i+1)+'</span>'+
          '<label class="field"><span>kg</span><input type="number" inputmode="decimal" step="0.5" min="0" data-f="kg" value="'+esc(s.kg)+'" aria-label="'+esc(e.name)+' set '+(i+1)+' kilograms"></label>'+
          '<label class="field"><span>'+(e.unit||"reps")+'</span><input type="number" inputmode="numeric" step="1" min="0" data-f="reps" value="'+esc(s.reps)+'" aria-label="'+esc(e.name)+' set '+(i+1)+' reps"></label>'+
          '<button class="chk" data-act="done" aria-label="Mark set '+(i+1)+' done">'+(s.done?'✓':'')+'</button></div>';
      });
      h+='<button class="ghost" data-act="add">+ Add a set</button></section>';
    });
    h+='<div class="card"><label class="l" for="note">Notes (optional)</label><textarea id="note" rows="2" placeholder="How did it feel? Seat settings, anything to remember">'+esc(draft.note)+'</textarea></div>';
    h+='<button class="primary" id="finish">Finish workout</button>';
    main.innerHTML=h;updateProgress();
  }

  function renderRuns(){
    var act=runDraft.act,A=ACTS[act],lc=NOUN[act],uk=act==='Stairs'?'floors':'km',today=todayISO(),cur=weekStart(today),cutoff=addDays(today,-27),wk=0,l4=0,longest=0;
    var mine=state.runs.filter(function(r){return actOf(r)===act});
    mine.forEach(function(r){if(weekStart(r.date)===cur)wk+=r.km;if(r.date>=cutoff&&r.date<=today)l4+=r.km;if(r.km>longest)longest=r.km});
    var h='<div class="seg">'+["Run","Row","Cycle","Stairs"].map(function(k){return '<button class="chip" data-kind="'+k+'" aria-pressed="'+(act===k)+'">'+k+'</button>'}).join('')+'</div>';
    h+='<div class="stats"><div class="stat"><b>'+fmtKm(wk)+'</b><span>'+uk+' this week</span></div><div class="stat"><b>'+fmtKm(l4)+'</b><span>'+uk+' last 4 wks</span></div><div class="stat"><b>'+(longest?fmtKm(longest):"–")+'</b><span>longest '+(act==="Stairs"?'session':lc+' km')+'</span></div></div>';
    h+='<section class="card"><h2>Log a '+lc+'</h2>';
    h+='<button class="btn" id="scan"'+(scanning?' disabled':'')+'>'+(scanning?'Reading photo…':'Scan a photo of the '+(act==="Row"?'rowing machine':act==="Cycle"?'exercise bike':act==="Stairs"?'stair climber':'treadmill')+' screen')+'</button>';
    h+='<div class="datebar"><label class="l" for="rdate">Date</label><input type="date" id="rdate" value="'+esc(runDraft.date)+'"></div>';
    if(WHERE[act])h+='<div><span class="last">Where</span><div class="where" style="margin-top:6px">'+WHERE[act].map(function(w){return '<button class="chip" data-where="'+w+'" aria-pressed="'+(runDraft.where===w)+'">'+w+'</button>'}).join('')+'</div></div>';
    h+='<label class="field"><span>'+A.distLabel+'</span><input type="number" id="rkm" inputmode="'+A.mode+'" step="'+A.step+'" min="0" placeholder="'+A.ph+'" value="'+esc(runDraft.km)+'"></label>';
    h+='<div class="row3"><label class="field"><span>Hours</span><input type="number" id="rh" inputmode="numeric" min="0" placeholder="0" value="'+esc(runDraft.h)+'"></label><label class="field"><span>Minutes</span><input type="number" id="rm" inputmode="numeric" min="0" placeholder="'+A.mph+'" value="'+esc(runDraft.m)+'"></label><label class="field"><span>Seconds</span><input type="number" id="rs" inputmode="numeric" min="0" max="59" placeholder="00" value="'+esc(runDraft.s)+'"></label></div>';
    h+='<div class="pacebox"><span class="last">'+A.paceLabel+'</span><b id="pacebox">–</b></div>';
    h+='<div><span class="last">Type</span><div class="chips" style="margin-top:6px">'+A.types.map(function(t){return '<button class="chip" data-type="'+t+'" aria-pressed="'+(runDraft.type===t)+'">'+t+'</button>'}).join('')+'</div></div>';
    h+='<div><span class="last">How did it feel?</span><div class="feel" style="margin-top:6px">'+[1,2,3,4,5].map(function(n){return '<button class="chip" data-feel="'+n+'" aria-pressed="'+(runDraft.feel===n)+'" aria-label="Feeling '+n+' of 5">'+n+'</button>'}).join('')+'</div><div class="feelcap" style="margin-top:4px"><span>Rough</span><span>Great</span></div></div>';
    h+='<label class="field"><span>Notes (optional)</span><textarea id="rnote" rows="2" placeholder="'+(act==="Row"?'Resistance, stroke rate, how it felt':act==="Cycle"?'Route, gears, resistance, how it felt':act==="Stairs"?'Level, how it felt':'Route, weather, legs, anything to remember')+'">'+esc(runDraft.note)+'</textarea></label>';
    h+='<button class="primary" id="saverun" disabled>Save '+lc+'</button></section>';
    h+='<section class="card"><h3>'+(act==="Stairs"?'Floors':'Kilometres')+' per week ('+lc+')</h3>'+weeklyChart(act)+'</section>';
    h+='<section class="card"><h3>'+(act==="Row"?'Split trend (lower is faster)':HIGHER[act]?(act==="Stairs"?'Floors per minute trend (higher is faster)':'Speed trend (higher is faster)'):'Pace trend (lower is faster)')+'</h3>'+paceChart(act)+'</section>';
    var list=sortedRuns(act);
    if(list.length){
      h+='<h3 style="font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 0">Past '+lc+'s</h3>';
      list.forEach(function(r){
        h+='<div class="card runitem"><div class="runhead"><b>'+esc(fmtDate(r.date))+'</b><span><span class="tag">'+esc(r.type||act)+'</span>'+(r.where?' <span class="tag">'+esc(r.where)+'</span>':'')+'</span></div>'+
          '<div class="runmeta"><span>'+fmtDist(act,r.km)+'</span><span>'+fmtDur(r.secs)+'</span><span>'+fmtMetric(act,r.km,r.secs)+' '+A.per+'</span>'+(r.feel?'<span>Felt '+r.feel+'/5</span>':'')+'</div>'+
          (r.note?'<div class="note">'+esc(r.note)+'</div>':'')+
          '<button class="del" data-delrun="'+esc(r.id)+'">'+(confirmDel===r.id?'Tap again to delete':'Delete')+'</button></div>';
      });
    }
    main.innerHTML=h;updatePaceBox();
  }

  function renderHist(){
    var s=sortedSessions(),h="";
    if(!s.length){main.innerHTML='<div class="empty">No workouts logged yet.<br>Finish your first one on the Today tab and it shows up here.</div>';return}
    var rows="";
    EX.forEach(function(e){
      var best=null,latest=null;
      s.forEach(function(x){var a=x.sets&&x.sets[e.id];if(!a)return;a.forEach(function(st){if(st.kg!=null&&(best===null||st.kg>best))best=st.kg})});
      for(var i=0;i<s.length;i++){var a=s[i].sets&&s[i].sets[e.id];if(a&&a.length){var k=a.map(function(z){return z.kg}).filter(function(z){return z!=null});if(k.length){latest=Math.max.apply(null,k);break}}}
      rows+='<tr><td>'+esc(e.name)+'</td><td class="num">'+(best!==null?best:"–")+'</td><td class="num">'+(latest!==null?latest:"–")+'</td></tr>';
    });
    h+='<div class="card"><h2>Top weights (kg)</h2><div class="scroll"><table><thead><tr><th>Exercise</th><th class="num">Best</th><th class="num">Latest</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
    s.forEach(function(x){
      var total=0;EX.forEach(function(e){total+=(x.sets&&x.sets[e.id]?x.sets[e.id].length:0)});
      h+='<div class="card"><div class="sess-head"><b>'+esc(fmtDate(x.date))+'</b><span class="last">'+total+' sets</span></div><ul class="list">';
      EX.forEach(function(e){var a=x.sets&&x.sets[e.id];if(a&&a.length)h+='<li><span>'+esc(e.name)+'</span><span>'+esc(fmtSets(a))+'</span></li>'});
      h+='</ul>'+(x.note?'<div class="note">'+esc(x.note)+'</div>':'')+
        '<button class="del" data-del="'+esc(x.id)+'">'+(confirmDel===x.id?'Tap again to delete':'Delete')+'</button></div>';
    });
    main.innerHTML=h;
  }

  function renderAcct(){
    var h='<section class="card"><h2>Sync</h2>';
    if(!cloud.configured){
      h+='<div class="help">Sync isn\'t switched on. Everything is saved on this phone only. To sync across devices, follow the Firebase steps in the README, then paste your config into <b>firebase-config.js</b>.</div>';
    }else if(!cloud.ready){
      h+='<div class="help">'+(cloud.loading?'Connecting…':'Couldn\'t reach the sync service. You can keep logging, it saves on this phone.')+'</div>';
    }else if(!cloud.uid){
      h+='<div class="help">Signed out.</div>';
    }else{
      h+='<div class="help">Signed in as <b>'+esc(cloud.email||"")+'</b>. Your workouts, runs and photos sync automatically.</div><button class="btn" id="signout">Sign out</button>';
    }
    h+='</section>';
    h+='<section class="card"><h2>Backup</h2><div class="help">Keep a copy of your log, or move data in from the old Claude version.</div>'+
      '<div class="rowbtns"><button class="btn" id="bk-copy">Copy backup</button><button class="btn" id="bk-dl">Download backup</button></div>'+
      '<label class="field"><span>Import: paste a backup here</span><textarea id="imp" rows="3" placeholder="Paste backup text">'+esc(importText)+'</textarea></label>'+
      '<div class="rowbtns"><button class="btn" id="bk-import">Import pasted text</button><button class="btn" id="bk-file">Import from file</button></div></section>';
    h+='<div class="help" style="text-align:center">'+state.sessions.length+' workout'+(state.sessions.length===1?'':'s')+' · '+state.runs.length+' cardio session'+(state.runs.length===1?'':'s')+'</div>';
    main.innerHTML=h;
  }

  function render(){
    Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){b.setAttribute("aria-selected",b.dataset.tab===tab)});
    if(tab==="today")renderToday();else if(tab==="runs")renderRuns();else if(tab==="hist")renderHist();else renderAcct();
  }

  /* ---------- events ---------- */
  $("#tabs").addEventListener("click",function(ev){
    var b=ev.target.closest(".tab");if(!b)return;
    tab=b.dataset.tab;confirmDel=null;render();window.scrollTo(0,0);
  });
  main.addEventListener("click",function(ev){
    var t=ev.target.closest("button");if(!t)return;
    if(t.id==="warm"){draft.warm=!draft.warm;saveDraft();t.textContent=draft.warm?"✓":"";$("#warmcard").classList.toggle("done",draft.warm);return}
    if(t.id==="finish"){finishWorkout();return}
    if(t.id==="saverun"){saveRun();return}
    if(t.dataset.kind){
      if(runDraft.act!==t.dataset.kind){var d0=runDraft;runDraft=newRunDraft(t.dataset.kind);runDraft.date=d0.date;saveRunDraft();confirmDel=null;render()}
      return;
    }
    if(t.dataset.where){runDraft.where=t.dataset.where;saveRunDraft();render();return}
    if(t.id==="scan"){$("#scanfile").click();return}
    if(t.dataset.type){runDraft.type=t.dataset.type;saveRunDraft();render();return}
    if(t.dataset.feel){var n=+t.dataset.feel;runDraft.feel=runDraft.feel===n?0:n;saveRunDraft();render();return}
    if(t.dataset.del||t.dataset.delrun){
      var isRun=!!t.dataset.delrun,id=isRun?t.dataset.delrun:t.dataset.del;
      if(confirmDel===id){
        if(isRun){state.runs=state.runs.filter(function(x){return x.id!==id});cw("runs",id,null)}
        else{state.sessions=state.sessions.filter(function(x){return x.id!==id});cw("sessions",id,null)}
        confirmDel=null;saveLocal();render();toast(isRun?"Entry deleted":"Workout deleted");
      }else{confirmDel=id;render()}
      return;
    }
    if(t.id==="signout"){firebase.auth().signOut();return}
    if(t.id==="bk-copy"){
      var txt=backupJSON();
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast("Backup copied")},function(){toast("Couldn't copy. Use Download instead.")})}
      else toast("Couldn't copy. Use Download instead.");
      return;
    }
    if(t.id==="bk-dl"){
      try{
        var blob=new Blob([backupJSON()],{type:"application/json"}),a=document.createElement("a");
        a.href=URL.createObjectURL(blob);a.download="gym-log-backup-"+todayISO()+".json";document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
      }catch(e){toast("Couldn't download. Use Copy backup instead.")}
      return;
    }
    if(t.id==="bk-import"){var v=($("#imp").value||"").trim();if(!v){toast("Paste a backup first");return}importData(v);return}
    if(t.id==="bk-file"){$("#importfile").click();return}
    var card=t.closest("[data-ex]");if(!card)return;
    var id2=card.dataset.ex;
    if(t.dataset.act==="photo"){if(photos[id2])openLightbox(id2);else{pickFor=id2;$("#pick").click()}return}
    if(t.dataset.act==="add"){var arr=draft.sets[id2],l=arr[arr.length-1]||{kg:"",reps:""};arr.push({kg:l.kg,reps:l.reps,done:false});saveDraft();render();return}
    if(t.dataset.act==="done"){
      var row=t.closest(".setrow"),i=+row.dataset.i,s=draft.sets[id2][i];
      s.done=!s.done;saveDraft();row.classList.toggle("done",s.done);t.textContent=s.done?"✓":"";updateProgress();
    }
  });
  main.addEventListener("input",function(ev){
    var el=ev.target;
    if(el.id==="note"){draft.note=el.value;saveDraft();return}
    if(el.id==="date"){if(el.value){draft.date=el.value;saveDraft()}return}
    if(el.id==="imp"){importText=el.value;return}
    var rmap={rdate:"date",rkm:"km",rh:"h",rm:"m",rs:"s",rnote:"note"};
    if(rmap[el.id]){if(el.id==="rdate"&&!el.value)return;runDraft[rmap[el.id]]=el.value;saveRunDraft();updatePaceBox();return}
    if(el.dataset.f){
      var card=el.closest("[data-ex]"),row=el.closest(".setrow");
      draft.sets[card.dataset.ex][+row.dataset.i][el.dataset.f]=el.value;saveDraft();
    }
  });

  /* ---------- start ---------- */
  var cached=lsGet(K.data);if(cached){state.sessions=cached.sessions||[];state.runs=cached.runs||[]}
  var cp=lsGet(K.photos);if(cp&&typeof cp==="object")photos=cp;
  draft=lsGet(K.draft);
  if(!draft||!draft.sets||EX.some(function(e){return !draft.sets[e.id]}))draft=newDraft();
  runDraft=lsGet(K.runDraft);
  if(!runDraft||typeof runDraft!=="object"||!ACTS[runDraft.act])runDraft=newRunDraft(runDraft&&runDraft.act);
  if(ACTS[runDraft.act].types.indexOf(runDraft.type)<0)runDraft.type=ACTS[runDraft.act].defType;
  if(runDraft.where!=="Treadmill")runDraft.where="Outdoors";
  $("#gateform").addEventListener("submit",function(ev){
    ev.preventDefault();
    var em=$("#gem").value.trim(),pw=$("#gpw").value,er=$("#gerr"),b=$("#gbtn");
    if(!em||!pw){er.textContent="Enter your email and password.";return}
    if(!cloud.ready){er.textContent=cloud.loading?"Still connecting. Try again in a moment.":"Can't reach sign-in. Check your connection and try again.";if(!cloud.loading)initCloud();return}
    b.disabled=true;er.textContent="";
    firebase.auth().signInWithEmailAndPassword(em,pw).then(function(){},function(e){b.disabled=false;er.textContent=authMsg(e)});
  });
  var hasCfg=!!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey);
  if(hasCfg&&!lsGet(K.auth)){document.body.classList.add("locked");$("#gate").hidden=false}
  render();refreshStatus();initCloud();
  if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>
