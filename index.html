<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: one-column phone app. Sticky title bar with four tabs (Today / Runs / History / Account), set rows like a lifting logbook, simple SVG charts. */
:root{
  --bg:#070b0f; --surface:rgba(255,255,255,.05); --ink:#f1f5f7; --muted:#8e9ba6; --line:rgba(255,255,255,.1);
  --accent:#d4ff00; --accent-ink:#0a1006; --done:#d4ff00; --done-bg:rgba(212,255,0,.10); --danger:#ff7a66; --target:#ffffff;
  --glow:0 0 0 transparent;
  --ambient:#060709;
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 0 10px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.02em;text-transform:uppercase;margin:0}
.sub{color:var(--muted);font-size:14px;margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.tab{min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);border-radius:8px;letter-spacing:.04em;text-transform:uppercase;padding:0 4px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:12px;padding-top:14px}
label.l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
input,textarea,select{font:500 17px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px;min-width:0;width:100%}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.datebar input{width:auto}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:var(--done);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;margin:0;letter-spacing:.02em;text-transform:uppercase}
.card h3{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-left{display:flex;gap:12px;align-items:flex-start;min-width:0}
.target{font:600 13px var(--body);letter-spacing:.06em;color:var(--accent);white-space:nowrap;border:1px solid var(--accent);border-radius:6px;padding:3px 7px;font-variant-numeric:tabular-nums}
.last{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb{flex:none;width:64px;height:64px;border-radius:8px;border:1px dashed var(--line);background:var(--bg);color:var(--muted);font:600 11px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center}
.setrow .n{font:700 20px var(--display);color:var(--muted);text-align:center}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chk{min-height:48px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--muted);font:700 20px var(--body)}
.setrow.done .chk,.warm.done .chk{background:var(--done);border-color:var(--done);color:var(--bg)}
.setrow.done input{background:var(--done-bg);border-color:var(--done)}
.ghost{min-height:44px;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:8px;font:600 14px var(--body)}
.btn{min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:600 15px var(--body);padding:0 14px}
.primary{min-height:52px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;font:700 22px var(--display);letter-spacing:.06em;text-transform:uppercase}
.primary:disabled{opacity:.4}
.warm{flex-direction:row;align-items:center;gap:12px}
.warm .chk{width:52px;flex:none}
textarea{resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:92vw;text-align:center}
.toast[hidden]{display:none}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
th{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:4px 6px 6px}
td{padding:9px 6px;border-top:1px solid var(--line)}
td.num,th.num{text-align:right}
.scroll{overflow-x:auto}
.sess-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sess-head b{font:700 20px var(--display);letter-spacing:.03em;text-transform:uppercase}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:15px;font-variant-numeric:tabular-nums}
.list li{display:flex;justify-content:space-between;gap:10px}
.list li span:last-child{text-align:right;color:var(--muted)}
.note{font-size:14px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.del{align-self:flex-start;border:0;background:transparent;color:var(--danger);font:600 14px var(--body);min-height:44px;padding:0 4px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pacebox{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.pacebox b{font:700 28px var(--display);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px var(--body)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.feel .chip{padding:0;border-radius:8px;font:700 18px var(--display)}
.feelcap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.runitem{display:flex;flex-direction:column;gap:6px}
.runhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.runhead b{font:700 20px var(--display);letter-spacing:.03em;text-transform:uppercase}
.runmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;font-variant-numeric:tabular-nums}
.tag{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--muted);font:10px var(--body);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.cur{fill:var(--done)}
.chart .val{fill:var(--ink);font:600 10px var(--body)}
.chart .pt.tm{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.chart .tg{stroke:var(--target);stroke-width:1.5;stroke-dasharray:4 3}
.chart .tgl{fill:var(--target);font:600 10px var(--body)}
.sync{display:flex;align-items:center;gap:8px;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--done)}.dot.err{background:var(--danger)}
.help{font-size:14px;color:var(--muted)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.lb{position:fixed;inset:0;z-index:30;background:rgba(10,14,18,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.lb img{max-width:100%;max-height:70%;border-radius:10px;object-fit:contain}
.lb .cap{color:#fff;font:700 22px var(--display);letter-spacing:.04em;text-transform:uppercase}
.lb .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lb button{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid #fff;background:transparent;color:#fff;font:600 15px var(--body)}
.lb button.rm{border-color:#ff8a75;color:#ff8a75}
#gate{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
#gate[hidden]{display:none}
.gatecard{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.gatecard h1{font-size:44px}
.locked .wrap{display:none}
.where{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.scanline{font-size:14px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg .chip{border-radius:8px;font:700 20px var(--display);letter-spacing:.06em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.progress>i{transition:none}}

/* ---- Glow theme: glass cards, lime accent, floating nav ---- */
html{background:#070b0f}
body{background:transparent;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--ambient);pointer-events:none}
header{position:static;background:transparent;border-bottom:0;padding:calc(18px + env(safe-area-inset-top,0px)) 0 4px}
h1{font-weight:700;font-size:32px;letter-spacing:-.02em;text-transform:none}
.sub{font-weight:500}
.tabs{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;z-index:15;
  height:66px;padding:7px;gap:4px;border-radius:33px;background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),rgba(10,15,20,.88);border:1px solid rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.tab{border:0;background:transparent;color:var(--muted);border-radius:26px;text-transform:none;letter-spacing:0;font:600 14px var(--body);min-height:0}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{gap:14px}
input,textarea,select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;color:var(--ink);font-weight:600}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--glow)}
input::placeholder,textarea::placeholder{color:#5f6c77;font-weight:500}
.card,.stat{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.1);border-radius:22px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.card{padding:16px;gap:12px}
.card h2{font-weight:700;font-size:19px;letter-spacing:-.01em;text-transform:none}
.card h3{letter-spacing:.06em}
.stat{padding:14px 12px}
.stat b{font:700 28px/1 var(--display);letter-spacing:-.02em}
.stat span{text-transform:none;letter-spacing:0;font-size:12px;font-weight:500}
.target{color:var(--accent);border:0;background:rgba(182,244,58,.12);border-radius:12px;padding:5px 10px}
.thumb{border-radius:16px;border:1px dashed rgba(255,255,255,.22);background:rgba(255,255,255,.05)}
.setrow{grid-template-columns:24px 1fr 1fr 48px}
.setrow .n{font:600 14px var(--body)}
.chk{width:48px;min-height:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:transparent;justify-self:center;font:700 20px var(--body)}
.setrow.done .chk,.warm.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--glow)}
.setrow.done input{background:rgba(182,244,58,.12);border-color:rgba(182,244,58,.5);color:var(--accent)}
.warm .chk{width:48px}
.ghost{border:1px dashed rgba(255,255,255,.22);border-radius:14px;color:var(--muted)}
.btn{background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.25);border-radius:16px;color:var(--accent);min-height:48px}
.primary{min-height:54px;border-radius:27px;background:var(--accent);color:var(--accent-ink);font:700 16px var(--body);letter-spacing:.02em;text-transform:none;box-shadow:var(--glow)}
.primary:disabled{opacity:.35;box-shadow:none}
.chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:22px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--glow);font-weight:700}
.seg{grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;border-radius:26px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
.seg .chip{border:0;background:transparent;border-radius:22px;font:600 14px var(--body);letter-spacing:0;text-transform:none;padding:0;color:var(--muted)}
.seg .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow);font-weight:700}
.feel .chip{border-radius:14px;font:700 16px var(--body)}
.pacebox b{font:700 26px var(--display);letter-spacing:-.02em}
.runhead b,.sess-head b{font:700 17px var(--display);letter-spacing:-.01em;text-transform:none}
.tag{border:0;background:rgba(255,255,255,.08);border-radius:8px;padding:3px 8px;text-transform:none;letter-spacing:0;font-size:12px}
.progress{height:8px;background:rgba(255,255,255,.1);border-radius:4px}
.progress>i{background:var(--accent);box-shadow:var(--glow)}
.chart .bar{fill:rgba(182,244,58,.4)}
.chart .bar.cur{fill:var(--accent);filter:drop-shadow(0 0 6px rgba(182,244,58,.6))}
.chart .ln{stroke:#fff;stroke-width:2.5;filter:drop-shadow(0 0 5px rgba(182,244,58,.55))}
.chart .pt{fill:#fff;stroke:none}
.chart .pt.tm{fill:#070b0f;stroke:#fff;stroke-width:2}
.chart .tg{stroke-opacity:.7}
.toast{background:rgba(20,28,34,.92);color:var(--ink);border:1px solid rgba(182,244,58,.5);border-radius:16px;box-shadow:var(--glow);bottom:calc(98px + env(safe-area-inset-bottom,0px));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.lb button{border-radius:22px}
#gate{background:var(--ambient)}
.gatecard h1{font-size:40px}
.del{color:var(--danger)}

/* ---- Liquid glass v2: flat black, specular rims, lime only for status ---- */
html,body{background:#060709}
body{font-variant-numeric:tabular-nums lining-nums}
body::before{display:none}
h1{font-weight:800;letter-spacing:-.025em}
.card,.stat,.tabs{background:rgba(255,255,255,.04);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:0;border-top:1px solid rgba(255,255,255,.18);border-left:1px solid rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.03);
  box-shadow:inset 0 1px 1px 0 rgba(255,255,255,.15),0 12px 32px -8px rgba(0,0,0,.5)}
.card,.stat{border-radius:24px}
.tabs{border-radius:9999px;height:68px;padding:6px;gap:2px;max-width:420px;background:linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,.05)),rgba(18,20,24,.88)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:9999px;font:600 11px var(--body);color:rgba(255,255,255,.5);padding:0;border:1px solid transparent}
.tab[aria-selected="true"]{background:rgba(212,255,0,.14);border-color:rgba(212,255,0,.35);color:#d4ff00;box-shadow:inset 0 1px 1px 0 rgba(255,255,255,.2);font-weight:700}
label.l,.field span,.stat span,.card h3,.feelcap,th{text-transform:uppercase;font-size:.72rem;letter-spacing:.06em;color:rgba(255,255,255,.45);font-weight:600}
.stat b{font-weight:800}
.card h2{font-weight:700}
.target{background:rgba(255,255,255,.08);color:#fff}
input,textarea,select,.thumb{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);box-shadow:none}
input:focus,textarea:focus,select:focus{border-color:rgba(212,255,0,.7);box-shadow:0 0 0 1px rgba(212,255,0,.7)}
.setrow{padding:6px 6px 6px 0;margin:0 -6px;border-radius:20px;grid-template-columns:24px 1fr 1fr 48px}
.setrow.active{box-shadow:none;background:none}
.setrow.active .n{color:#d4ff00}
.setrow input{min-height:48px;font-weight:700}
.setrow.done input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08);color:var(--ink)}
.chk{border-color:rgba(255,255,255,.25);transition:transform .12s ease}
.chk:active,.chip:active,.primary:active,.btn:active,.tab:active{transform:scale(.92)}
.setrow.done .chk,.warm.done .chk{background:#d4ff00;border-color:#d4ff00;color:#0a1006;box-shadow:none}
.btn{background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.25);color:var(--ink);box-shadow:none}
.primary{background:#d4ff00;box-shadow:none}
.chip{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08);color:rgba(255,255,255,.6)}
.chip[aria-pressed="true"],.seg .chip[aria-pressed="true"]{background:rgba(212,255,0,.14);border-color:rgba(212,255,0,.35);color:#d4ff00;box-shadow:inset 0 1px 1px 0 rgba(255,255,255,.2)}
.seg{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 1px 0 rgba(255,255,255,.12)}
.seg .chip{color:rgba(255,255,255,.5);min-height:44px}
.chip{min-height:44px}
.progress>i{box-shadow:none}
.chart .bar{fill:rgba(255,255,255,.28)}
.chart .bar.cur{fill:#d4ff00;filter:none}
.chart .ln{filter:none;stroke:#fff}
.chart .tg{stroke:#fff;stroke-opacity:.4}
.chart .tgl{fill:rgba(255,255,255,.55)}
.chart .pt.tm{fill:#060709}
.toast{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 32px -8px rgba(0,0,0,.5);color:var(--ink)}
#gate{background:#060709}
@media (prefers-reduced-motion:reduce){.chk,.chip,.primary,.btn,.tab{transition:none}.chk:active,.chip:active,.primary:active,.btn:active,.tab:active{transform:none}}

/* ---- Performance and ergonomics ---- */
html{touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
input,textarea,select{-webkit-user-select:text;user-select:text;touch-action:manipulation}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.card,.stat,.tabs{border-top-color:rgba(220,235,255,.2);border-left-color:rgba(220,235,255,.12);border-right-color:rgba(220,235,255,.12);border-bottom-color:rgba(220,235,255,.04)}
.toast{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(36,40,46,.96)}
.tabs{transition:transform .22s ease,opacity .22s ease}
body.kb .tabs{transform:translateY(160%);opacity:0;pointer-events:none}
.setrow.active{outline:0}
.card{overflow:visible}
@media (prefers-reduced-motion:reduce){.tabs{transition:none}}

/* ---- Round 3 polish ---- */
body:has(input:focus:not(#hapi),textarea:focus,select:focus) .tabs{transform:translateY(140%);opacity:0;pointer-events:none}
.tabs{transition:transform .25s cubic-bezier(.16,1,.3,1),opacity .2s ease}
.card,.stat{background:rgba(255,255,255,.045);border-top-color:rgba(220,235,255,.2);border-left-color:rgba(220,235,255,.07);border-right-color:rgba(220,235,255,.07);border-bottom-color:rgba(220,235,255,.03);
  box-shadow:inset 0 1px 0 0 rgba(255,255,255,.1),0 12px 32px -8px rgba(0,0,0,.5)}
.tab[aria-selected="true"]{background:rgba(200,255,0,.12);border-color:rgba(200,255,0,.4);box-shadow:inset 0 1px 1px 0 rgba(255,255,255,.18),0 0 16px -2px rgba(200,255,0,.2)}
table th.num,table td.num{text-align:right}
table td{border-top:0;border-bottom:1px solid rgba(255,255,255,.04);padding:12px 6px}
table tbody tr:last-child td{border-bottom:0}
table td.num{font-weight:700}
body{padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}

/* ---- Auto-hide dock on scroll ---- */
body.navhide .tabs{transform:translateY(calc(100% + 40px));opacity:0;pointer-events:none}
#navhandle{position:fixed;left:50%;bottom:calc(4px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:96px;height:28px;border:0;background:transparent;z-index:14;opacity:0;pointer-events:none;transition:opacity .25s ease;padding:0}
#navhandle::before{content:"";position:absolute;left:50%;top:50%;width:44px;height:5px;margin:-2px 0 0 -22px;border-radius:3px;background:rgba(255,255,255,.35)}
body.navhide #navhandle{opacity:1;pointer-events:auto}
body.kb #navhandle{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#navhandle{transition:none}}

/* ---- Icon-only liquid glass dock that fades ---- */
.tabs{height:58px;padding:0 10px;max-width:340px;gap:0;align-items:stretch;
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03)),rgba(18,20,24,.78);
  -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);
  border:0;border-top:1px solid rgba(220,235,255,.28);box-shadow:inset 0 1px 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 0 rgba(255,255,255,.04),0 14px 36px -10px rgba(0,0,0,.7);
  transition:opacity .45s ease,transform .45s cubic-bezier(.22,.8,.3,1)}
.tab,.tab[aria-selected="true"]{background:transparent;border:0;box-shadow:none;border-radius:0;gap:5px;color:rgba(255,255,255,.42)}
.tab svg{width:24px;height:24px}
.tab span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab[aria-selected="true"]{color:#d4ff00;background:radial-gradient(circle closest-side at 50% 45%,rgba(212,255,0,.18) 0%,transparent 100%)}
.tab[aria-selected="true"]::after{content:"";width:4px;height:4px;border-radius:50%;background:#d4ff00;box-shadow:0 0 8px #d4ff00}
.tab[aria-selected="true"] svg{filter:drop-shadow(0 0 6px rgba(212,255,0,.45))}
body.navhide .tabs,body.kb .tabs{transform:translateY(14px) scale(.94);opacity:0;pointer-events:none}
#navhandle{transition:opacity .45s ease}
.toast{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
#gate{align-items:flex-start;padding:0 20px;box-sizing:border-box}.gatecard{margin:auto}

.recrow .rb span{font:600 10.5px var(--body);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.spark0{width:64px}
.menuov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);border:0;border-radius:0;padding:0}
.menupop{position:fixed;right:20px;z-index:61;width:236px;border-radius:22px;padding:6px;display:flex;flex-direction:column;background:linear-gradient(rgba(255,255,255,.06),rgba(255,255,255,.06)),rgba(22,24,29,.94);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-top:1px solid rgba(220,235,255,.25);box-shadow:inset 0 1px 1px 0 rgba(255,255,255,.18),0 24px 60px -12px rgba(0,0,0,.7)}

/* settings v2 */
.sh{margin:0;font:800 30px var(--body);letter-spacing:-.025em}
.backrow{align-self:flex-start;display:flex;align-items:center;gap:2px;min-height:44px;background:none;border:0;color:rgba(255,255,255,.55);font:600 15px var(--body);padding:0}
.sgroup{background:rgba(255,255,255,.045);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-radius:22px;border-top:1px solid rgba(220,235,255,.2);border-left:1px solid rgba(220,235,255,.07);border-right:1px solid rgba(220,235,255,.07);overflow:hidden;display:flex;flex-direction:column}

.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:12px 16px;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.05);border-radius:0;color:var(--ink);text-align:left;width:100%;box-sizing:border-box;font-family:var(--body)}
.srow:last-child{border-bottom:0}
.srow svg{color:rgba(255,255,255,.35);flex:none}
.sl{display:flex;flex-direction:column;gap:2px;min-width:0;flex-grow:1}

.sl small{font:500 12.5px var(--body);color:rgba(255,255,255,.5);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.so{background:none;border:0;color:rgba(255,255,255,.55);font:600 14px var(--body);min-height:44px;padding:0 4px;flex:none}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8a93a0;margin-right:6px;vertical-align:1px}
.sdot.ok{background:#3ddc84;box-shadow:0 0 8px rgba(61,220,132,.6)}
.sw{position:relative;width:52px;height:32px;border-radius:16px;border:0;padding:0;background:rgba(255,255,255,.16);flex:none;transition:background .2s ease}
.sw i{position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform .22s cubic-bezier(.22,.8,.3,1),background .2s}
.sw[aria-checked="true"]{background:#d4ff00}
.sw[aria-checked="true"] i{transform:translateX(20px);background:#0a1006}

/* consistent dock position on short pages (iOS standalone) */
html{min-height:100%}
body{min-height:calc(100vh + 2px)}
html,body{overflow-x:hidden;overscroll-behavior-x:none;max-width:100%}
body{touch-action:pan-y}
.scrollrow{touch-action:pan-x pan-y}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.2)}

/* compact header */
.sub{display:none}
header{padding:calc(14px + env(safe-area-inset-top,0px)) 0 0}
header h1{font:800 30px var(--body);letter-spacing:-.025em;text-transform:none;display:flex;align-items:center;gap:10px}
body[data-tab="today"] header{padding-top:env(safe-area-inset-top,0px)}

body[data-sync="warn"] header h1::after,body[data-sync="err"] header h1::after,body[data-sync="warn"] .th::after,body[data-sync="err"] .th::after{content:"";width:9px;height:9px;border-radius:50%;background:#ffb020;box-shadow:0 0 8px rgba(255,176,32,.6)}

.th{margin:0;font:800 30px var(--body);letter-spacing:-.025em;display:flex;align-items:center;gap:10px}
.todayhead{margin-top:0}
.proginline{display:flex;align-items:center;gap:12px}

.proginline .pl{font:700 13.5px var(--body);color:rgba(255,255,255,.7);white-space:nowrap}

.subh{margin:6px 0 0;font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.45)}
.hf{margin:-2px 0}
.rstats{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 14px var(--body);color:rgba(255,255,255,.6)}

.rowbtns{display:flex;gap:8px}
.rowbtns .btn{flex:1;border-radius:9999px}

.exlist{gap:0}

.exrow:last-child{border-bottom:0}
.ex1{display:flex;align-items:center;gap:8px}
.exname{flex:1;min-width:0;font:700 16px var(--body)}
.exmv{display:flex;gap:2px;flex:none}
.exmv button{width:36px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.7);font-size:12px}

    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="today" aria-label="Today" aria-selected="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>Today</span></button>

<script>
(function(){
  "use strict";
  var EX=[
    {id:"leg-press",name:"Leg press",sets:3,range:"10–12",rest:"Rest about 2 min"},
    {id:"chest-press",name:"Chest press machine",sets:3,range:"10–12"},
    {id:"lat-pulldown",name:"Lat pulldown",sets:3,range:"10–12"},
    {id:"leg-curl",name:"Seated leg curl",sets:3,range:"12"},
    {id:"shoulder-press",name:"Shoulder press machine",sets:2,range:"10–12"},
    {id:"core",name:"Cable crunch / plank",sets:3,range:"12",unit:"reps or sec"}
  ];
  var TARGET_SECS_PER_KM=8100/21.0975; // sub 2:15 half marathon
  var K={data:"gl-data-v2",photos:"gl-photos-v2",draft:"gl-draft-v2",runDraft:"gl-rundraft-v2",auth:"gl-auth-v1"};
  var state={sessions:[],runs:[],routines:[]}, photos={}, draft=null, runDraft=null, tab="today";
  var confirmDel=null, pickFor=null, importText="";
  var cloud={ready:false,uid:null,email:null,db:null,unsubs:[],err:null,configured:false,loading:false};
  var $=function(s){return document.querySelector(s)};
  var main=$("#main");

  /* ---------- helpers ---------- */
  function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function num(v){var n=parseFloat(v);return isFinite(n)?n:null}
  function pad(n){return String(n).padStart(2,"0")}
  function todayISO(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function parseISO(iso){var p=iso.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
  function toISO(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function fmtDate(iso){return parseISO(iso).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
  var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function fmtShort(iso){var d=parseISO(iso);return d.getDate()+" "+MON[d.getMonth()]}
  function weekStart(iso){var d=parseISO(iso),off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return toISO(d)}
  function addDays(iso,n){var d=parseISO(iso);d.setDate(d.getDate()+n);return toISO(d)}
  function fmtPace(sec){if(!isFinite(sec)||sec<=0)return "–";var s=Math.round(sec);return Math.floor(s/60)+":"+pad(s%60)}
  function fmtDur(sec){var s=Math.round(sec),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),r=s%60;return h?h+":"+pad(m)+":"+pad(r):m+":"+pad(r)}
  function fmtKm(k){return (Math.round(k*100)/100).toString()}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function toast(t){var el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){el.hidden=true},2600)}
  function typing(){var a=document.activeElement;return !!a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")}

  /* ---------- persistence ---------- */
  function saveLocal(){
    var ok=lsSet(K.data,{sessions:state.sessions,runs:state.runs,routines:state.routines});
    var ok2=lsSet(K.photos,photos);
    if(!ok||!ok2)toast("Phone storage is full. Remove a photo or sync to the cloud.");
  }
  function saveDraft(){lsSet(K.draft,draft)}
  function saveRunDraft(){lsSet(K.runDraft,runDraft)}

  /* ---------- cloud sync (Firebase, optional) ---------- */
  function setStatus(kind,text){
    var d=$("#dot"),s=$("#status");
    if(d)d.className="dot"+(kind==="ok"?" ok":kind==="err"?" err":"");
    if(s)s.textContent=text;
    document.body.dataset.sync=(cloud.configured&&kind!=="ok")?(kind==="err"?"err":"warn"):"";
  }
  function refreshStatus(){
    if(!cloud.configured)return setStatus("local","Saved on this phone");
    if(!cloud.ready)return setStatus("local",cloud.loading?"Connecting…":"Saved on this phone");
    if(!cloud.uid)return setStatus("local","Saved on this phone · signed out");
    if(cloud.err)return setStatus("err",cloud.err);

    var unit=String(o.distance_unit||"").toLowerCase(),km;
    if(act==="Stairs"&&(unit==="steps"||unit==="step"))return null;
    if(unit==="mi"||unit==="miles")km=dist*1.609344;

    else if(unit==="km")km=dist;
    else km=act==="Row"?dist/1000:dist;
    if(act==="Stairs")km=dist;
    if(act==="Row"&&km<0.1)return null;
    var extra=[];
    if(num(o.stroke_rate_spm)>0)extra.push("Rate "+Math.round(num(o.stroke_rate_spm))+" spm");
    if(num(o.avg_watts)>0)extra.push(Math.round(num(o.avg_watts))+" W");

    if(act==="Run"&&num(o.incline_percent)>0)extra.push("Incline "+num(o.incline_percent)+"%");

  }

  if(!draft||!draft.sets||EX.some(function(e){return !draft.sets[e.id]}))draft=newDraft();
  runDraft=lsGet(K.runDraft);
  if(!runDraft||typeof runDraft!=="object"||!ACTS[runDraft.act])runDraft=newRunDraft(runDraft&&runDraft.act);
  if(ACTS[runDraft.act].types.indexOf(runDraft.type)<0)runDraft.type=ACTS[runDraft.act].defType;
  if(runDraft.where!=="Treadmill")runDraft.where="Outdoors";
  $("#gateform").addEventListener("submit",function(ev){
    ev.preventDefault();
    var em=$("#gem").value.trim(),pw=$("#gpw").value,er=$("#gerr"),b=$("#gbtn");
    if(!em||!pw){er.textContent="Enter your email and password.";return}
    if(!cloud.ready){er.textContent=cloud.loading?"Still connecting. Try again in a moment.":"Can't reach sign-in. Check your connection and try again.";if(!cloud.loading)initCloud();return}
    b.disabled=true;er.textContent="";
    firebase.auth().signInWithEmailAndPassword(em,pw).then(function(){},function(e){b.disabled=false;er.textContent=authMsg(e)});
  });
  var hasCfg=!!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey);
  if(hasCfg&&!lsGet(K.auth)){document.body.classList.add("locked");$("#gate").hidden=false}
  render();refreshStatus();initCloud();
  if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();

(function(){var g=document.getElementById("gate");if(!g)return;var vv=window.visualViewport;
function fit(){if(vv){g.style.height=vv.height+"px";g.style.top=vv.offsetTop+"px";g.style.bottom="auto"}}
function center(ev){setTimeout(function(){fit();if(ev&&ev.target&&ev.target.scrollIntoView)ev.target.scrollIntoView({block:"center",behavior:"smooth"})},300)}
if(vv){vv.addEventListener("resize",fit);vv.addEventListener("scroll",fit)}
g.addEventListener("focusin",center);g.addEventListener("focusout",function(){setTimeout(function(){if(!g.contains(document.activeElement)){g.style.height="";g.style.top="";g.style.bottom=""}},100)});})();
</script>
